[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emnist-conv-mlp-classifier"
version = "1.0.0"
description = "A convolutional multilayer perceptron for EMNIST ByClass character classification."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sid Ak Singh"}]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[tool.setuptools.packages.find]
where = ["src"]

